  /resource-servers/{id}/grants:
    post:
      tags:
        - Resource sharing
      summary: Create a grant for a resource server
      description: |
        Shares the resource server to other organization unit(s), cascading by default to every
        resource and action currently beneath it. `ouId` selects the organization unit performing
        this share; it defaults to the resource server's own owning organization unit when
        omitted. See the "Resource sharing" tag description above for the two target-scope modes
        (root-targeting vs. children-targeting) and `excludedNodeIds`. Returns every grant created
        across the whole cascade, not just the top node.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Resource server ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequest'
            examples:
              selected-roots:
                summary: Owner shares the resource server, and everything beneath it, to specific Root OUs
                value:
                  rootOuIds:
                    - "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
              cascade-with-exclusion:
                summary: Share the whole tree except specific descendants
                value:
                  rootOuIds:
                    - "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                  excludedNodeIds:
                    - "9c2e1a5c-2b1e-4f0a-8c1a-5a6b7c8d9e0f"
      responses:
        "201":
          description: Share grant(s) created, one per node in the cascade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantListResponse'
              example:
                grants:
                  - id: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
                    nodeType: "resource_server"
                    nodeId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    stage: "share"
                    targetScope: "root"
                    targetOuId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                    owningOuId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                  - id: "2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e"
                    nodeType: "resource"
                    nodeId: "ad7e4h1h-8f9c-4e93-c565-5e3ddf98hi6f"
                    stage: "share"
                    targetScope: "root"
                    targetOuId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                    owningOuId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-request-format:
                  summary: Neither target-scope mode selected, both selected, or an invalid request body
                  value:
                    code: "SHR-1001"
                    message:
                      key: "error.sharingservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.sharingservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                invalid-target-ou:
