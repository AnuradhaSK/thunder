openapi: 3.0.3
info:
  title: Resource Server Management API
  version: "1.0"
  description: |
    Resource servers in ThunderID define the permission namespace for a protected API or service; resources and actions nested within them form the permission strings used in role assignments.
    Resources can be nested hierarchically, and permissions are derived from the handle-based path structure.
    Resource Server identifier is optional and if provided, must be unique within the system.
    Resource, and Action handles are unique under it's parent and are immutable after creation and used directly for permission derivation.
    Resource parent hierarchy is immutable after creation.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: "localhost"
      port:
        default: "8090"

tags:
  - name: Resource Servers
    description: |
      Register and manage resource servers that define OAuth2 permission scopes.

      **API access scopes.** Three OAuth scopes grant access to this API: `system`
      (unrestricted, may act on any resource server, resource, or action in any organization
      unit), `system:resource-servers` (full access: list, read, create, update, delete, and
      manage grants), and `system:resource-servers:view` (read-only: list, read, and read
      grants). Each of the latter two is confined to the token's own organization unit, the
      organization unit its issuing client application belongs to, the same view/manage split the
      Role Management API and the OU/user/group/user-type/agent-type APIs use. A resource server
      is owned by a single organization unit (the `ouId` on the resource server); a resource or an
      action has no `ouId` of its own and is always owned by its resource server's.

      Holding either of those two scopes, a caller is subject to these organization-unit rules:
      - **Create is owner-only.** `POST /resource-servers` requires the requested `ouId` to be the
        caller's own organization unit; `POST /resource-servers/{id}/resources` and the
        `POST .../actions` variants require the parent resource server's `ouId` to be it. A caller
        naming any other organization unit is rejected with `RES-1024`. A grant does not
        widen this: an organization unit a resource server was merely shared to may not create
        resources or actions under it.
      - **Single-entity reads and share-grant operations also accept shared entities.**
        `GET /resource-servers/{id}`, `GET .../resources/{id}`, `GET .../actions/{id}`, and every
        operation on the four `.../grants` route groups (`POST`, `GET`, and `DELETE`) accept
        an entity that is either owned by the caller's own organization unit or currently visible
        to it through a grant, and reject anything else with `RES-1024`. This is what lets a
        sharee read what was shared to it, and reshare it onward into its own subtree.
      - **Update and delete are owner-only, enforced by the sharing framework.** `PUT` and
        `DELETE` on a resource server, a resource, or an action all change core (non-templated)
        configuration, so they are gated by the sharing framework's own ownership check rather
        than the organization-unit reach check above, and reject a non-owner with `SHR-1007`.
        Visibility through a grant never confers this. `PUT /resource-servers/{id}` checks
        the existing record's `ouId` and, when the request moves the resource server to a
        different organization unit, the destination `ouId` too, so both must be the caller's own.

      **`GET /resource-servers` is organization-unit confined.** A caller holding
      `system:resource-servers` or `system:resource-servers:view` but not `system` receives the
      resource servers its own organization unit owns plus those shared to it, never the
      deployment-wide listing, matching how Role's `GET /roles` reroutes such a caller to its own
      organization unit's owned-plus-shared listing. `totalResults` reflects that filtered set. A
      caller holding `system` still receives every resource server in the deployment.

      **Known limitation: the nested list endpoints are not organization-unit filtered.**
      `GET /resource-servers/{id}/resources` and the `GET .../actions` list endpoints apply the
      scope tier only, so a caller that can see a resource server at all can enumerate every
      resource and action beneath it. In practice a caller reaches these paths only for a resource
      server it owns or one shared to it, and the compound permission check decides independently
      which of those resources and actions are usable, so this exposes catalog metadata rather
      than access. These endpoints are expected to gain the same owned-plus-shared treatment
      later.
  - name: Resources
    description: Manage hierarchical resources within a resource server.
  - name: Actions
    description: Define actions on resources; actions map directly to OAuth2 scopes used in permission grants.
  - name: Permissions
    description: Preview and retrieve derived permissions based on the resource handle hierarchy.
  - name: Resource sharing
    description: |
      Resource servers, resources, and actions can be shared to other organization units (OUs),
      reusing the same generic sharing framework that powers Role sharing. See
 for the
      full design.

      **Three sharing-framework resource types, one per tree level.** A resource server, a
      resource, and an action are each shared independently through their own
      `.../grants` sub-resource, so a specific action can be withheld while a sibling
      action, or the resource it belongs to, stays shared. Owning an entity's resource server
      is what makes it usable by a role at all: a role may only be granted a permission whose
      resource server, and whose specific resource/action, are both visible, owned or shared, to
      the role's own organization unit.

      **Cascade share.** Sharing a resource server, or a non-leaf resource, fans out to every
      resource/action currently beneath it in a single call: `POST .../grants` creates one
      grant for the node itself and one for each of its current descendants, all with the same
      target-scope policy. `excludedNodeIds`, a field with no equivalent on Role's `ShareRequest`,
      names specific descendant resource/action ids to leave out of that cascade (e.g. share a
      `Bookings` resource but withhold its `create` action). Excluding a non-leaf descendant only
      skips that descendant's own grant; its own children are still enumerated separately and
      are shared unless they are also named in `excludedNodeIds`.

      **Auto-inherit on creation.** Creating a new resource or action under an already-shared
      parent (a resource server, or a resource) replays every grant currently recorded for that
      parent onto the new child automatically, so it becomes visible to the same organization
      units immediately, with no separate share call.

      **Cascade unshare.** Revoking a cascade share's top-level grant
      (`DELETE .../grants/{grantId}`) also revokes every descendant grant created alongside
      it by that same call, including ones later reshared or auto-inherited on top, as long as
      they still target the identical organization unit selection as the grant being revoked.

      **The deployment root permission is a bypass, not a grant.** The literal deployment
      root permission is always treated as visible to every organization unit, unconditionally; it
      is never itself the subject of a share or unshare call.

      Each of the four route groups below (`/resource-servers/{id}/grants`,
      `/resource-servers/{rsId}/resources/{id}/grants`,
      `/resource-servers/{rsId}/actions/{id}/grants`, and
      `/resource-servers/{rsId}/resources/{resourceId}/actions/{id}/grants`) exposes the
      same `POST`/`GET`/`DELETE` shape as Role's own `/roles/{id}/grants`: `POST` creates a
      grant (cascading, by default, for a resource server or a non-leaf resource), `GET` lists only
      that node's own grants, not its descendants' grants, and `DELETE` revokes a grant by id.
      There are no separate `/share` or `/reshare` action endpoints, and, unlike Role, no
      `editableFields`: resource servers, resources, and actions declare no templated fields, so
      there is no per-OU editable state a grant needs to scope down.

      **Who may call these.** `POST` and `DELETE` on any of these route groups require the
      `system:resource-servers` scope (or `system`), and `GET` requires
      `system:resource-servers:view` (or either of the other two, which cover it). Beyond the
      scope, all three also require the node being acted on to be owned by, or currently shared
      to, the caller's own organization unit, rejecting anything else with `RES-1024`. That is
      what makes a reshare by a sharee the same call, with the same check, as the owner's own
      original share. See "API access scopes" in the "Resource Servers" section above.

security:
  - OAuth2: [system]

paths:
  /resource-servers:
    get:
      tags:
        - Resource Servers
      summary: List resource servers
      parameters:
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
      responses:
        "200":
          description: List of resource servers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServerListResponse'
              example:
                totalResults: 5
                startIndex: 1
                count: 2
                resourceServers:
                  - id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    name: "Booking System"
                    description: "Handles all booking operations"
                    identifier: "https://api.example.com/booking"
                    type: "API"
                    ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                    delimiter: ":"
                  - id: "257e528f-eb24-48b6-884d-20460e190957"
                    name: "Property Management"
                    description: "Property and facility management"
                    identifier: "https://api.example.com/property"
                    type: "CUSTOM"
                    ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                    delimiter: ":"
                links:
                  - href: "resource-servers?offset=2&limit=2"
                    rel: "next"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-limit:
                  summary: Invalid limit parameter
                  value:
                    code: "RES-1011"
                    message:
                      key: "error.resourceservice.invalid_limit_parameter"
                      defaultValue: "Invalid limit parameter"
                    description:
                      key: "error.resourceservice.invalid_limit_parameter_description"
                      defaultValue: "The limit parameter must be a positive integer"
                invalid-offset:
                  summary: Invalid offset parameter
                  value:
                    code: "RES-1012"
                    message:
                      key: "error.resourceservice.invalid_offset_parameter"
                      defaultValue: "Invalid offset parameter"
                    description:
                      key: "error.resourceservice.invalid_offset_parameter_description"
                      defaultValue: "The offset parameter must be a non-negative integer"
                result-limit-exceeded:
                  summary: Result limit exceeded in composite mode
                  value:
                    code: "RES-1021"
                    message:
                      key: "error.resourceservice.result_limit_exceeded_in_composite_mode"
                      defaultValue: "Result limit exceeded in composite mode"
                    description:
                      key: "error.resourceservice.result_limit_exceeded_in_composite_mode_description"
                      defaultValue: "The total number of records exceeds the maximum limit in composite mode"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

    post:
      tags:
        - Resource Servers
      summary: Create a new resource server
      description: Creates a new resource server with the specified details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceServerRequest'
            example:
              name: "Booking System"
              description: "Handles all booking operations"
              identifier: "https://api.example.com/booking"
              ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
      responses:
        "201":
          description: Resource server created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServer'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "Booking System"
                description: "Handles all booking operations"
                identifier: "https://api.example.com/booking"
                type: "CUSTOM"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                delimiter: ":"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "RES-1001"
                    message:
                      key: "error.resourceservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.resourceservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                ou-not-found:
                  summary: Organization unit not found
                  value:
                    code: "RES-1010"
                    message:
                      key: "error.resourceservice.organization_unit_not_found"
                      defaultValue: "Organization unit not found"
                    description:
                      key: "error.resourceservice.organization_unit_not_found_description"
                      defaultValue: "The specified organization unit does not exist"
                invalid-delimiter:
                  summary: Invalid delimiter
                  value:
                    code: "RES-1015"
                    message:
                      key: "error.resourceservice.invalid_delimiter"
                      defaultValue: "Invalid delimiter"
                    description:
                      key: "error.resourceservice.invalid_delimiter_description"
                      defaultValue: "Delimiter must be a single character from: a-z A-Z 0-9 . _ : - /"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                name-conflict:
                  summary: Name conflict
                  value:
                    code: "RES-1004"
                    message:
                      key: "error.resourceservice.name_conflict"
                      defaultValue: "Name conflict"
                    description:
                      key: "error.resourceservice.name_conflict_description"
                      defaultValue: "A resource server with the same name already exists"
                identifier-conflict:
                  summary: Identifier conflict
                  value:
                    code: "RES-1013"
                    message:
                      key: "error.resourceservice.identifier_conflict"
                      defaultValue: "Identifier conflict"
                    description:
                      key: "error.resourceservice.identifier_conflict_description"
                      defaultValue: "A resource server with the same identifier already exists"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

  /resource-servers/{id}:
    get:
      tags:
        - Resource Servers
      summary: Get resource server details
      description: Returns resource server metadata
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resource server details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServer'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "Booking System"
                description: "Handles all booking operations"
                identifier: "https://api.example.com/booking"
                type: "API"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                delimiter: ":"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RES-1002"
                message:
                  key: "error.resourceservice.missing_id"
                  defaultValue: "Invalid request format"
                description:
                  key: "error.resourceservice.missing_id_description"
                  defaultValue: "Resource server ID is required"
        "404":
          description: Resource server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RES-1003"
                message:
                  key: "error.resourceservice.resource_server_not_found"
                  defaultValue: "Resource server not found"
                description:
                  key: "error.resourceservice.resource_server_not_found_description"
                  defaultValue: "The resource server with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

    put:
      tags:
        - Resource Servers
      summary: Update resource server
      description: Updates resource server name, description, identifier, and organization unit.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceServerRequest'
            example:
              name: "Booking System Updated"
              description: "Updated description for booking operations"
              identifier: "https://api.example.com/booking/v2"
              ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
      responses:
        "200":
          description: Resource server updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServer'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "Booking System Updated"
                description: "Updated description for booking operations"
                identifier: "https://api.example.com/booking/v2"
                type: "API"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                delimiter: ":"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing-id:
                  summary: Missing resource server ID
                  value:
                    code: "RES-1002"
                    message:
                      key: "error.resourceservice.missing_id"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.resourceservice.missing_id_description"
                      defaultValue: "Resource server ID is required"
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "RES-1001"
                    message:
                      key: "error.resourceservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.resourceservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                ou-not-found:
                  summary: Organization unit not found
                  value:
                    code: "RES-1010"
                    message:
                      key: "error.resourceservice.organization_unit_not_found"
                      defaultValue: "Organization unit not found"
                    description:
                      key: "error.resourceservice.organization_unit_not_found_description"
                      defaultValue: "The specified organization unit does not exist"
                immutable-resource-server:
                  summary: Cannot modify declarative resource server
                  value:
                    code: "RES-1018"
                    message:
                      key: "error.resourceservice.cannot_modify_declarative_resource_server"
                      defaultValue: "Cannot modify declarative resource server"
                    description:
                      key: "error.resourceservice.cannot_modify_declarative_resource_server_description"
                      defaultValue: "Resource server is defined in declarative configuration and cannot be modified"
        "404":
          description: Resource server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RES-1003"
                message:
                  key: "error.resourceservice.resource_server_not_found"
                  defaultValue: "Resource server not found"
                description:
                  key: "error.resourceservice.resource_server_not_found_description"
                  defaultValue: "The resource server with the specified id does not exist"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                name-conflict:
                  summary: Name conflict
                  value:
                    code: "RES-1004"
                    message:
                      key: "error.resourceservice.name_conflict"
                      defaultValue: "Name conflict"
                    description:
                      key: "error.resourceservice.name_conflict_description"
                      defaultValue: "A resource server with the same name already exists"
                identifier-conflict:
                  summary: Identifier conflict
                  value:
                    code: "RES-1013"
                    message:
                      key: "error.resourceservice.identifier_conflict"
                      defaultValue: "Identifier conflict"
                    description:
                      key: "error.resourceservice.identifier_conflict_description"
                      defaultValue: "A resource server with the same identifier already exists"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

    delete:
      tags:
        - Resource Servers
      summary: Delete a resource server by id
      description: Deletes a resource server. Cannot delete if it has resources or actions.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Resource server deleted
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing-id:
                  summary: Missing resource server ID
                  value:
                    code: "RES-1002"
                    message:
                      key: "error.resourceservice.missing_id"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.resourceservice.missing_id_description"
                      defaultValue: "Resource server ID is required"
                cannot-delete:
                  summary: Cannot delete resource server
                  value:
                    code: "RES-1006"
                    message:
                      key: "error.resourceservice.cannot_delete"
                      defaultValue: "Cannot delete resource server"
                    description:
                      key: "error.resourceservice.cannot_delete_description"
                      defaultValue: "Cannot delete resource server that has resources or actions"
                immutable-resource-server:
                  summary: Cannot delete declarative resource server
                  value:
                    code: "RES-1018"
                    message:
                      key: "error.resourceservice.cannot_modify_declarative_resource_server"
                      defaultValue: "Cannot modify declarative resource server"
                    description:
                      key: "error.resourceservice.cannot_modify_declarative_resource_server_description"
                      defaultValue: "Resource server is defined in declarative configuration and cannot be modified"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

  /resource-servers/{rsId}/resources:
    get:
      tags:
        - Resources
      summary: List resources in resource server
      description: |
        Returns a paginated list of resources. Use the parentId parameter to filter:
        - No parentId: returns only top-level resources (where parent is null)
        - parentId={uuid}: returns direct children of specified parent
      parameters:
        - in: path
          name: rsId
          required: true
          schema:
            type: string
            format: uuid
          description: Resource server ID
        - in: query
          name: parentId
          required: false
          schema:
            type: string
            format: uuid
          description: |
            Parent resource ID to filter children.
            - Omit parameter: returns only top-level resources (parent is null)
            - UUID: returns direct children of that parent
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
      responses:
        "200":
          description: List of resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListResponse'
              examples:
                top-level-only:
                  summary: Top-level resources (no parentId specified)
                  value:
                    totalResults: 3
                    startIndex: 1
                    count: 2
                    resources:
                      - id: "7a4b1f8e-5c69-4b60-9232-2b0aaf65ef3c"
                        name: "Reservations"
                        description: "Reservation management"
                        handle: "reservations"
                        permission: "reservations"
                      - id: "6b1e7b8d-7e19-41eb-8fa2-c0ee5bb67a94"
                        name: "Payments"
                        description: "Payment processing"
                        handle: "payments"
                        permission: "payments"
                    links:
                      - href: "resource-servers/3fa85f64-5717-4562-b3fc-2c963f66afa6/resources?offset=2&limit=2"
                        rel: "next"
                children-of-parent:
                  summary: Children of specific parent
                  value:
                    totalResults: 2
                    startIndex: 1
                    count: 2
                    resources:
                      - id: "8b5c2f9f-6d7a-4c71-a343-3c1bbf76fg4d"
                        name: "Online Booking"
                        description: "Online booking subsystem"
                        handle: "online-booking"
                        parent: "7a4b1f8e-5c69-4b60-9232-2b0aaf65ef3c"
                        permission: "reservations:online-booking"
                      - id: "7c4d5e6f-8f3a-4e93-c565-5e3ddf98hi6f"
                        name: "Phone Booking"
                        description: "Phone-based booking"
                        handle: "phone-booking"
                        parent: "7a4b1f8e-5c69-4b60-9232-2b0aaf65ef3c"
                        permission: "reservations:phone-booking"
                    links: []
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-limit:
                  summary: Invalid limit parameter
                  value:
                    code: "RES-1011"
                    message:
                      key: "error.resourceservice.invalid_limit_parameter"
                      defaultValue: "Invalid limit parameter"
                    description:
                      key: "error.resourceservice.invalid_limit_parameter_description"
                      defaultValue: "The limit parameter must be a positive integer"
                invalid-offset:
                  summary: Invalid offset parameter
                  value:
                    code: "RES-1012"
                    message:
                      key: "error.resourceservice.invalid_offset_parameter"
