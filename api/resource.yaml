components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:8090/oauth2/authorize
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs
            system:resource-servers: |
              Full access to the Resource Server Management API, confined to the token's own
              organization unit (see the "Resource Servers" tag description)
            system:resource-servers:view: |
              Read-only access to the Resource Server Management API, confined to the token's own
              organization unit (see the "Resource Servers" tag description)
        clientCredentials:
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs
            system:resource-servers: |
              Full access to the Resource Server Management API, confined to the token's own
              organization unit (see the "Resource Servers" tag description)
            system:resource-servers:view: |
              Read-only access to the Resource Server Management API, confined to the token's own
              organization unit (see the "Resource Servers" tag description)

  parameters:
    limitQueryParam:
      in: query
      name: limit
      required: false
      description: Maximum number of records to return
      schema:
        type: integer
        minimum: 1
        default: 30
    offsetQueryParam:
      in: query
      name: offset
      required: false
      description: Number of records to skip for pagination
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    ResourceServer:
      type: object
      required: [id, name, identifier, type, ouId, delimiter]
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the resource server
        name:
          type: string
          description: Name of the resource server
        description:
          type: string
          nullable: true
          description: Optional description of the resource server
        identifier:
          type: string
          description: Unique identifier for this resource server. When set to an absolute URI, the resource server is used in RFC 8707 resource indicator flows and the identifier is used as the access token audience claim value.
        type:
          type: string
          enum: [API, MCP, CUSTOM]
          description: Immutable type of the resource server (metadata only). Defaults to CUSTOM when not provided at creation.
        ouId:
          type: string
          format: uuid
          description: ID of the organization unit this resource server belongs to
        delimiter:
          type: string
          description: Character used to separate permission hierarchy levels (immutable after creation)
        isReadOnly:
          type: boolean
          description: Whether the resource server is read-only (system-managed)

    CreateResourceServerRequest:
      type: object
      required: [name, ouId, identifier]
      properties:
        name:
          type: string
          description: Name of the resource server
        description:
          type: string
          description: Optional description of the resource server
        identifier:
          type: string
          description: Unique identifier for this resource server. When set to an absolute URI, the resource server is used in RFC 8707 resource indicator flows and clients can use this value in the resource parameter to request audience-restricted access tokens.
        type:
          type: string
          enum: [API, MCP, CUSTOM]
          description: Optional immutable type of the resource server (metadata only). Defaults to CUSTOM when not provided.
        ouId:
          type: string
          format: uuid
          description: ID of the organization unit this resource server belongs to
        delimiter:
          type: string
          description: Optional delimiter character for permission hierarchy (defaults to ":", immutable after creation)

    UpdateResourceServerRequest:
      type: object
      required: [name, ouId]
      properties:
        name:
          type: string
          description: Name of the resource server
        description:
          type: string
          description: Optional description of the resource server
        identifier:
          type: string
          description: Unique identifier for this resource server. When set to an absolute URI, the resource server is used in RFC 8707 resource indicator flows.
        ouId:
          type: string
          format: uuid
          description: ID of the organization unit this resource server belongs to

    Resource:
      type: object
      required: [id, name, handle, permission]
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the resource
        name:
          type: string
          description: Display name of the resource
        handle:
          type: string
          description: Immutable and unique under resource server or parent resource. Identifier used for permission derivation
        description:
          type: string
          nullable: true
          description: Optional description of the resource
        parent:
          type: string
          format: uuid
          description: Parent resource ID. Absent for top-level resources (immutable after creation)
        permission:
          type: string
          description: Derived permission string based on handle hierarchy

    CreateResourceRequest:
      type: object
      required: [name, handle]
      properties:
        name:
          type: string
          description: Display name of the resource
        handle:
          type: string
          description: Immutable and unique under resource server or parent resource. Identifier used for permission derivation
        description:
          type: string
          description: Optional description of the resource
        parent:
          type: string
          format: uuid
          nullable: true
          description: Parent resource ID (null for top-level resources, immutable after creation)

    UpdateResourceRequest:
      type: object
      properties:
        name:
          type: string
          description: Display name of the resource (mutable)
        description:
          type: string
          description: Optional description of the resource

    Action:
      type: object
      required: [id, name, handle, permission]
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the action
        name:
          type: string
          description: Display name of the action
        handle:
          type: string
          description: Immutable and unique under resource server or resource. Identifier used for permission derivation
        description:
          type: string
          nullable: true
          description: Optional description of the action
        permission:
          type: string
          description: Derived permission string based on handle hierarchy
        kind:
          type: string
          enum: [tool, resource]
          description: >
            MCP primitive kind. "tool" represents a callable MCP tool (model-controlled); "resource"
            represents a read-only MCP resource (application-controlled). Always present for type=MCP
            actions (defaults to "tool" when omitted on create). For API and CUSTOM resource server
            actions it is present only when a kind was provided on create, otherwise omitted.
            Immutable after creation.

    CreateActionRequest:
      type: object
      required: [name, handle]
      properties:
        name:
          type: string
          description: Display name of the action
        handle:
          type: string
          maxLength: 100
          description: Immutable and unique under resource server or resource. Identifier used for permission derivation. Maximum length is 100 characters.
        description:
          type: string
          description: Optional description of the action
        kind:
          type: string
          enum: [tool, resource]
          description: >
            MCP primitive kind. Optional for all resource server types; when provided it must be
            "tool" or "resource". For type=MCP it defaults to "tool" when omitted. For API and
            CUSTOM resource servers it is optional and, when omitted, stays empty. Immutable after
            creation; omit on update requests (kind cannot be changed).

    UpdateActionRequest:
      type: object
      properties:
        name:
          type: string
          description: Display name of the action
        description:
          type: string
          description: Optional description of the action

    ResourceServerListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: Number of results that match the listing operation
          example: 8
        startIndex:
          type: integer
          description: Index of the first element of the page, which will be equal to offset + 1
          example: 1
        count:
          type: integer
          description: Number of elements in the returned page
          example: 5
        resourceServers:
          type: array
          items:
            $ref: '#/components/schemas/ResourceServer'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    ResourceListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: Number of results that match the listing operation
          example: 15
        startIndex:
          type: integer
          description: Index of the first element of the page, which will be equal to offset + 1
          example: 1
        count:
          type: integer
          description: Number of elements in the returned page
          example: 10
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    ActionListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: Number of results that match the listing operation
          example: 12
        startIndex:
          type: integer
          description: Index of the first element of the page, which will be equal to offset + 1
          example: 1
        count:
          type: integer
          description: Number of elements in the returned page
          example: 10
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    ShareRequest:
      type: object
      description: |
        Exactly one of two target-scope modes must be selected: root-targeting (`allRoots` or
        `rootOuIds`) or children-targeting (`allChildren` or `ouIds`). See the "Resource sharing"
        tag description for the full semantics; they are identical to Role's own `ShareRequest`
        except for `excludedNodeIds`, which Role's does not have.
      properties:
        ouId:
          type: string
          format: uuid
          description: |
            The organization unit performing this share. Optional; defaults to the node's own
            owning organization unit (its resource server's `ouId`) when omitted. Root-targeting
            mode is only valid when this is the node's own owning organization unit.
            Children-targeting mode is valid for any organization unit currently visible for the
            node.
        allRoots:
          type: boolean
          description: Share to every current and future Root organization unit. Root-targeting mode.
        rootOuIds:
          type: array
          items:
            type: string
            format: uuid
          description: Share to these specific Root organization units. Root-targeting mode.
        excludedRootOuIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Carves these Root organization units, and their entire subtrees, out of an `allRoots`
            share. Ignored unless `allRoots` is true.
        allChildren:
          type: boolean
          description: |
            Share to every organization unit in ouId's subtree, including ones created afterward,
            any depth, in one grant. Children-targeting mode.
        ouIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Share to these specific organization units. Each must be ouId's direct child.
            Ignored when `allChildren` is true. Children-targeting mode.
        excludedOuIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Carves these organization units, and their entire subtrees, out of an `allChildren`
            share. Ignored unless `allChildren` is true.
        excludedNodeIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Resource/action ids to leave out of the cascade this request otherwise performs when
            sharing a resource server or a non-leaf resource (see the "Resource sharing" tag
            description's cascade share/exclusion explanation). Ignored on a leaf action's own
            share request, which has no descendants to cascade to. Excluding a non-leaf
            descendant only skips that descendant's own grant; its own children are still
            enumerated and shared unless they are also listed here.

    Grant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nodeType:
          type: string
          enum:
            - resource_server
            - resource
            - action
          description: |
            Which of the three sharing-framework resource types this grant covers. A single
            cascade share can create grants across several different node types in one call.
        nodeId:
          type: string
          format: uuid
          description: ID of the resource server, resource, or action this specific grant covers.
        stage:
          type: string
          enum:
            - share
            - reshare
          description: |
            Who issued this grant, not which target-scope mode it used: `share` for a grant
            issued by the node's own owning organization unit, `reshare` for a grant issued by a
            previously-visible sharee organization unit distributing further within its own
            subtree.
        targetScope:
          type: string
          enum:
            - all_roots
            - root
            - all_children
            - ou
          description: The breadth of organization units this grant targets.
        targetOuId:
          type: string
          format: uuid
        owningOuId:
          type: string
          format: uuid
          description: The organization unit that owns the shared node's resource server.
        excludedOuIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Organization units (and their subtrees) carved out of this grant. Only ever non-empty
            for the `all_roots`/`all_children` target scopes.

    GrantListResponse:
      type: object
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'

    Link:
      type: object
      properties:
        href:
          type: string
          example: "resource-servers?offset=20&limit=10"
        rel:
          type: string
          example: "next"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: "Error code. Codes follow the RES-XXXX convention."
          example: "RES-1001"
        message:
          $ref: '#/components/schemas/I18nMessage'
        description:
          $ref: '#/components/schemas/I18nMessage'

    I18nMessage:
      type: object
      description: Internationalized message with translation key and default value.
      required:
        - key
        - defaultValue
      properties:
        key:
          type: string
          description: Translation key for fetching localized message.
        defaultValue:
          type: string
          description: Default message in English (fallback).
