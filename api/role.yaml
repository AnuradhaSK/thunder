openapi: 3.0.3
info:
  title: Role Management API
  version: "1.0"
  description: Define and assign roles for permission-based access control. Roles aggregate permissions derived from resource server scopes and can be assigned directly to users or groups.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: "localhost"
      port:
        default: "8090"

tags:
  - name: Roles
    description: |
      Create roles, define their permissions, and assign them to users, groups, apps, or agents.
      A role is owned by one organization unit, and `system:roles`/`system:roles:view` callers may
      only act within their own.
  - name: Role sharing
    description: |
      Share an owned role to other organization units without copying it: the role keeps one id and
      its owner keeps sole control of name, description and permissions, while each organization
      unit it reaches keeps its own separate assignments.
security:
  - OAuth2: [system]

paths:
  /roles:
    get:
      tags:
        - Roles
      summary: List roles
      description: |
        Without `ouId`, lists every role in the deployment. With `ouId`, lists only the roles
        owned by or shared to that organization unit, each tagged with `origin` (`owned` or
        `shared`).
      parameters:
        - $ref: '#/components/parameters/ouIdListingQueryParam'
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
              examples:
                deployment-wide:
                  summary: Without ouId (deployment-wide listing, no origin)
                  value:
                    totalResults: 5
                    startIndex: 1
                    count: 2
                    roles:
                      - id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        name: "front-desk-agent"
                        description: "Front desk agent role with booking and customer management permissions"
                        ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                        ouHandle: "default"
                        isReadOnly: false
                      - id: "257e528f-eb24-48b6-884d-20460e190957"
                        name: "hotel-manager"
                        description: "Hotel manager with full property access"
                        ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                        ouHandle: "default"
                        isReadOnly: true
                    links:
                      - href: "roles?offset=2&limit=2"
                        rel: "next"
                owned-and-shared:
                  summary: With ouId (owned + shared, with origin)
                  value:
                    totalResults: 2
                    startIndex: 1
                    count: 2
                    roles:
                      - id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        name: "front-desk-agent"
                        description: "Front desk agent role with booking and customer management permissions"
                        ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                        ouHandle: "default"
                        isReadOnly: false
                        origin: "owned"
                      - id: "9c2e1a5c-2b1e-4f0a-8c1a-5a6b7c8d9e0f"
                        name: "regional-manager"
                        description: "Shared from the parent organization"
                        ouId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                        ouHandle: "north-region"
                        isReadOnly: false
                        origin: "shared"
                    links: []
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "ROL-1001"
                    message:
                      key: "error.roleservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.roleservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                invalid-limit:
                  summary: Invalid limit parameter
                  value:
                    code: "ROL-1008"
                    message:
                      key: "error.roleservice.invalid_limit_parameter"
                      defaultValue: "Invalid limit parameter"
                    description:
                      key: "error.roleservice.invalid_limit_parameter_description"
                      defaultValue: "The limit parameter must be a positive integer"
                invalid-offset:
                  summary: Invalid offset parameter
                  value:
                    code: "ROL-1009"
                    message:
                      key: "error.roleservice.invalid_offset_parameter"
                      defaultValue: "Invalid offset parameter"
                    description:
                      key: "error.roleservice.invalid_offset_parameter_description"
                      defaultValue: "The offset parameter must be a non-negative integer"
        "403":
          description: |
            Forbidden. A system:roles-scoped caller passed an `ouId` other than its own
            organization unit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1023"
                message:
                  key: "error.roleservice.role_outside_own_ou_scope"
                  defaultValue: "Outside the caller's organization unit scope"
                description:
                  key: "error.roleservice.role_outside_own_ou_scope_description"
                  defaultValue: "The system:roles scope confines the caller to its own token-issued organization unit; the requested organization unit is outside that scope"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

    post:
      tags:
        - Roles
      summary: Create a new role
      description: Creates a new role with optional initial permissions and assignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
            example:
              name: "front-desk-agent"
              description: "Front desk agent role with booking and customer management permissions"
              ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
              permissions:
                - resourceServerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  permissions:
                    - "create_reservation"
                    - "view_reservation"
                    - "update_reservation"
                    - "check_in_guest"
                    - "check_out_guest"
                - resourceServerId: "7b8c9d0e-1f2a-3b4c-5d6e-7f8a9b0c1d2e"
                  permissions:
                    - "process_payment"
                    - "view_payment"
                    - "view_customer_profile"
                    - "update_customer_profile"
              assignments:
                - type: "user"
                  id: "7a4b1f8e-5c69-4b60-9232-2b0aaf65ef3c"
                - type: "group"
                  id: "6b1e7b8d-7e19-41eb-8fa2-c0ee5bb67a94"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleWithAssignments'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "front-desk-agent"
                description: "Front desk agent role with booking and customer management permissions"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                ouHandle: "default"
                permissions:
                  - resourceServerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    permissions:
                      - "create_reservation"
                      - "view_reservation"
                      - "update_reservation"
                      - "check_in_guest"
                      - "check_out_guest"
                  - resourceServerId: "7b8c9d0e-1f2a-3b4c-5d6e-7f8a9b0c1d2e"
                    permissions:
                      - "process_payment"
                      - "view_payment"
                      - "view_customer_profile"
                      - "update_customer_profile"
                assignments:
                  - type: "user"
                    id: "7a4b1f8e-5c69-4b60-9232-2b0aaf65ef3c"
                    display: "John Doe"
                  - type: "group"
                    id: "6b1e7b8d-7e19-41eb-8fa2-c0ee5bb67a94"
                    display: "Front Desk Team"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "ROL-1001"
                    message:
                      key: "error.roleservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.roleservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                invalid-assignment-id:
                  summary: Invalid assignment ID
                  value:
                    code: "ROL-1007"
                    message:
                      key: "error.roleservice.invalid_assignment_id"
                      defaultValue: "Invalid assignment ID"
                    description:
                      key: "error.roleservice.invalid_assignment_id_description"
                      defaultValue: "One or more assignment IDs in the request do not exist or do not match the claimed type"
                ou-not-found:
                  summary: Organization unit not found
                  value:
                    code: "ROL-1005"
                    message:
                      key: "error.roleservice.organization_unit_not_found"
                      defaultValue: "Organization unit not found"
                    description:
                      key: "error.roleservice.organization_unit_not_found_description"
                      defaultValue: "Organization unit not found"
                invalid-permissions:
                  summary: Invalid permissions
                  value:
                    code: "ROL-1012"
                    message:
                      key: "error.roleservice.invalid_permissions"
                      defaultValue: "Invalid permissions"
                    description:
                      key: "error.roleservice.invalid_permissions_description"
                      defaultValue: "One or more permissions do not exist in the resource management system"
                declarative-mode:
                  summary: Role creation not allowed in declarative-only mode
                  value:
                    code: "ROL-1015"
                    message:
                      key: "error.roleservice.cannot_create_role_in_declarative_only_mode"
                      defaultValue: "Cannot create role in declarative-only mode"
                    description:
                      key: "error.roleservice.cannot_create_role_in_declarative_only_mode_description"
                      defaultValue: "Role creation is not allowed when running in declarative-only mode. Roles must be defined in declarative configuration files"
        "403":
          description: |
            Forbidden. Either the caller's organization unit does not match the requested `ouId`
            and the caller does not hold the deployment's unrestricted permission (a role may only
            be created for the organization unit that will own it), or the requested permissions
            would exceed what the caller itself holds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                outside-own-ou-scope:
                  summary: The caller's own organization unit does not match the requested ouId
                  value:
                    code: "ROL-1023"
                    message:
                      key: "error.roleservice.role_outside_own_ou_scope"
                      defaultValue: "Outside the caller's organization unit scope"
                    description:
                      key: "error.roleservice.role_outside_own_ou_scope_description"
                      defaultValue: "The system:roles/system:roles:view scope confines the caller to its own token-issued organization unit; the requested organization unit is outside that scope"
                insufficient-privileges:
                  summary: The requested permissions exceed what the caller itself holds
                  value:
                    code: "SAZ-4030"
                    message:
                      key: "error.sysauthz.grant_not_permitted"
                      defaultValue: "Insufficient privileges to grant these permissions"
                    description:
                      key: "error.sysauthz.grant_not_permitted_description"
                      defaultValue: "The operation would grant permissions that the caller does not hold"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1004"
                message:
                  key: "error.roleservice.role_name_conflict"
                  defaultValue: "Role name conflict"
                description:
                  key: "error.roleservice.role_name_conflict_description"
                  defaultValue: "A role with the same name exists under the same organization unit"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

  /roles/{id}:
    get:
      tags:
        - Roles
      summary: Get role details
      description: Returns role metadata with permissions list
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Role details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "front-desk-agent"
                description: "Front desk agent role with booking and customer management permissions"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                ouHandle: "default"
                permissions:
                  - resourceServerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    permissions:
                      - "create_reservation"
                      - "view_reservation"
                  - resourceServerId: "7b8c9d0e-1f2a-3b4c-5d6e-7f8a9b0c1d2e"
                    permissions:
                      - "process_payment"
                      - "view_customer_profile"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1002"
                message:
                  key: "error.roleservice.missing_role_id"
                  defaultValue: "Invalid request format"
                description:
                  key: "error.roleservice.missing_role_id_description"
                  defaultValue: "Role ID is required"
        "403":
          description: |
            Forbidden. A system:roles-scoped caller requested a role owned by a different
            organization unit, and it has not been shared to the caller's own organization unit
            either.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1023"
                message:
                  key: "error.roleservice.role_outside_own_ou_scope"
                  defaultValue: "Outside the caller's organization unit scope"
                description:
                  key: "error.roleservice.role_outside_own_ou_scope_description"
                  defaultValue: "The system:roles scope confines the caller to its own token-issued organization unit; the requested organization unit is outside that scope"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1003"
                message:
                  key: "error.roleservice.role_not_found"
                  defaultValue: "Role not found"
                description:
                  key: "error.roleservice.role_not_found_description"
                  defaultValue: "The role with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

    put:
      tags:
        - Roles
      summary: Update role
      description: Updates role name, description, organization unit, and permissions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
            example:
              name: "senior-front-desk-agent"
              description: "Senior front desk agent with additional permissions"
              ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
              permissions:
                - resourceServerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  permissions:
                    - "create_reservation"
                    - "view_reservation"
                    - "update_reservation"
                    - "cancel_reservation"
                - resourceServerId: "7b8c9d0e-1f2a-3b4c-5d6e-7f8a9b0c1d2e"
                  permissions:
                    - "process_payment"
                    - "view_payment"
                    - "refund_payment"
                    - "view_customer_profile"
                    - "update_customer_profile"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "senior-front-desk-agent"
                description: "Senior front desk agent with additional permissions"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                ouHandle: "default"
                permissions:
                  - resourceServerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    permissions:
                      - "create_reservation"
                      - "view_reservation"
                      - "update_reservation"
                      - "cancel_reservation"
                  - resourceServerId: "7b8c9d0e-1f2a-3b4c-5d6e-7f8a9b0c1d2e"
                    permissions:
                      - "process_payment"
                      - "view_payment"
                      - "refund_payment"
                      - "view_customer_profile"
                      - "update_customer_profile"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing-role-id:
                  summary: Missing role ID
                  value:
                    code: "ROL-1002"
                    message:
                      key: "error.roleservice.missing_role_id"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.roleservice.missing_role_id_description"
                      defaultValue: "Role ID is required"
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "ROL-1001"
                    message:
                      key: "error.roleservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.roleservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                ou-not-found:
                  summary: Organization unit not found
                  value:
                    code: "ROL-1005"
                    message:
                      key: "error.roleservice.organization_unit_not_found"
                      defaultValue: "Organization unit not found"
                    description:
                      key: "error.roleservice.organization_unit_not_found_description"
                      defaultValue: "Organization unit not found"
                invalid-permissions:
                  summary: Invalid permissions
                  value:
                    code: "ROL-1012"
                    message:
                      key: "error.roleservice.invalid_permissions"
                      defaultValue: "Invalid permissions"
                    description:
                      key: "error.roleservice.invalid_permissions_description"
                      defaultValue: "One or more permissions do not exist in the resource management system"
                immutable-role:
                  summary: Cannot modify declarative role
                  value:
                    code: "ROL-1013"
                    message:
                      key: "error.roleservice.cannot_modify_declarative_role"
                      defaultValue: "Cannot modify declarative role"
                    description:
                      key: "error.roleservice.cannot_modify_declarative_role_description"
                      defaultValue: "The role is defined in declarative configuration and cannot be modified"
        "403":
          description: |
            Forbidden. Either the caller's organization unit does not own this role (and, if the
            request moves the role, does not own the destination organization unit either) and the
            caller does not hold the deployment's unrestricted permission, or the requested
            permissions would exceed what the caller itself holds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                core-config-owner-only:
                  summary: The caller does not own this role (or the destination, on a move)
                  value:
                    code: "SHR-1007"
                    message:
                      key: "error.sharingservice.core_config_owner_only"
                      defaultValue: "Core configuration can only be modified by the owning organization unit"
                    description:
                      key: "error.sharingservice.core_config_owner_only_description"
                      defaultValue: "The caller's organization unit does not own this resource; only the owning organization unit, or an unrestricted caller, may create, modify, or delete its core configuration"
                insufficient-privileges:
                  summary: The requested permissions exceed what the caller itself holds
                  value:
                    code: "SAZ-4030"
                    message:
                      key: "error.sysauthz.grant_not_permitted"
                      defaultValue: "Insufficient privileges to grant these permissions"
                    description:
                      key: "error.sysauthz.grant_not_permitted_description"
                      defaultValue: "The operation would grant permissions that the caller does not hold"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1003"
                message:
                  key: "error.roleservice.role_not_found"
                  defaultValue: "Role not found"
                description:
                  key: "error.roleservice.role_not_found_description"
                  defaultValue: "The role with the specified id does not exist"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1004"
                message:
                  key: "error.roleservice.role_name_conflict"
                  defaultValue: "Role name conflict"
                description:
                  key: "error.roleservice.role_name_conflict_description"
                  defaultValue: "A role with the same name exists under the same organization unit"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

    delete:
      tags:
        - Roles
      summary: Delete a role by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Role deleted
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing-role-id:
                  summary: Missing role ID
                  value:
                    code: "ROL-1002"
                    message:
                      key: "error.roleservice.missing_role_id"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.roleservice.missing_role_id_description"
                      defaultValue: "Role ID is required"
                immutable-role:
                  summary: Cannot modify declarative role
                  value:
                    code: "ROL-1013"
                    message:
                      key: "error.roleservice.cannot_modify_declarative_role"
                      defaultValue: "Cannot modify declarative role"
                    description:
                      key: "error.roleservice.cannot_modify_declarative_role_description"
                      defaultValue: "The role is defined in declarative configuration and cannot be modified"
        "403":
          description: |
            Forbidden. The caller's organization unit does not own this role, and the caller does
            not hold the deployment's unrestricted permission — a role may only be deleted by its
            owning organization unit, regardless of any grant. Note this is `ROL-1024`, a
            role-specific error, not the generic `SHR-1007` used by `PUT /roles/{id}`: deletion is
            its own resource-type-meaningful violation, not a core-config edit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1024"
                message:
                  key: "error.roleservice.deletion_restricted_to_owner"
                  defaultValue: "Role deletion not permitted"
                description:
                  key: "error.roleservice.deletion_restricted_to_owner_description"
                  defaultValue: "Only the role's owning organization unit, or an unrestricted caller, may delete this role; a shared or reshared organization unit cannot delete the original role"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1003"
                message:
                  key: "error.roleservice.role_not_found"
                  defaultValue: "Role not found"
                description:
                  key: "error.roleservice.role_not_found_description"
                  defaultValue: "The role with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

  /roles/{id}/assignments:
    get:
      tags:
        - Roles
      summary: Get role assignments
