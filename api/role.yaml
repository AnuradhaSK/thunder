  /roles/{id}/grants:
    post:
      tags:
        - Role sharing
      summary: Create a grant for a role
      description: |
        Grants the role to other organization units, and returns the grants created.

        `initiatingOuId` is the organization unit doing the granting, defaulting to the role's own
        owning organization unit. Choose exactly one target mode:

        - **Root-targeting** (`allRoots` or `rootOuIds`) reaches Root organization units, the only
          way out of the owner's own subtree. The owning organization unit alone may use it.
        - **Children-targeting** (`allChildren` or `ouIds`) reaches into `initiatingOuId`'s own
          subtree. Open to the owner and to any organization unit the role is already visible to,
          which is how a sharee passes it further down.

        Each `ouIds` entry names one direct child and says, via its own `allChildren`, whether that
        child's whole subtree comes with it. That is how a single call hands one named branch over
        whole, where `allChildren` at the top level hands over every branch and an entry without
        the flag reaches the named child alone.

        `editableFields` limits what the targets may edit. The `ShareRequest` schema below covers
        each field, including the exclusion lists; the examples show one call per mode.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequest'
            examples:
              selected-roots:
                summary: Owner shares to specific Root organization units
                value:
                  rootOuIds:
                    - "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
              all-roots-except:
                summary: Owner shares to all Roots except some
                value:
                  allRoots: true
                  excludedRootOuIds:
                    - "9c2e1a5c-2b1e-4f0a-8c1a-5a6b7c8d9e0f"
              owner-single-call:
                summary: Owner shares directly to its own children, in one call, no prior grant
                value:
                  allChildren: true
              all-children-except:
                summary: An already-visible organization unit shares to all its children except some
                value:
                  initiatingOuId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                  allChildren: true
                  excludedOuIds:
                    - "9c2e1a5c-2b1e-4f0a-8c1a-5a6b7c8d9e0f"
              selected-immediate-children:
                summary: Share to specific direct children only (a grandchild must share again)
                value:
                  initiatingOuId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                  ouIds:
                    - ouId: "9c2e1a5c-2b1e-4f0a-8c1a-5a6b7c8d9e0f"
              named-child-with-its-subtree:
                summary: Share one named child together with its whole branch, in one call
                value:
                  initiatingOuId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                  ouIds:
                    - ouId: "9c2e1a5c-2b1e-4f0a-8c1a-5a6b7c8d9e0f"
                      allChildren: true
              mixed-children:
                summary: One child gets its whole branch, another gets only itself
                value:
                  initiatingOuId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                  ouIds:
                    - ouId: "9c2e1a5c-2b1e-4f0a-8c1a-5a6b7c8d9e0f"
                      allChildren: true
                    - ouId: "0d1e2f3a-4b5c-6d7e-8f9a-0b1c2d3e4f5a"
              named-child-subtree-except:
                summary: A named child's branch, minus part of that branch
                value:
                  initiatingOuId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                  ouIds:
                    - ouId: "9c2e1a5c-2b1e-4f0a-8c1a-5a6b7c8d9e0f"
                      allChildren: true
                  excludedOuIds:
                    - "0d1e2f3a-4b5c-6d7e-8f9a-0b1c2d3e4f5a"
              reshare-narrower-editability:
                summary: A sharee reshares further, narrowing editability to a subset of its own
                value:
                  initiatingOuId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                  ouIds:
                    - ouId: "9c2e1a5c-2b1e-4f0a-8c1a-5a6b7c8d9e0f"
                  editableFields:
                    - "assignments.group"
      responses:
        "201":
          description: Grant(s) created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantCreationResponse'
              example:
                grants:
                  - id: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
                    stage: "share"
                    targetScope: "root"
                    targetOuId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                    owningOuId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                    editableFields:
                      - "assignments"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-request-format:
                  summary: |
                    Neither target-scope mode selected, both selected, or an invalid request body
                  value:
                    code: "SHR-1001"
                    message:
                      key: "error.sharingservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.sharingservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                invalid-target-ou:
                  summary: |
                    A rootOuIds entry is not itself a Root organization unit, or an ouIds entry is
                    not initiatingOuId's direct child (e.g. a grandchild, or a Root)
                  value:
                    code: "SHR-1004"
                    message:
                      key: "error.sharingservice.invalid_target_ou"
                      defaultValue: "Invalid target organization unit"
                    description:
                      key: "error.sharingservice.invalid_target_ou_description"
                      defaultValue: "The target organization unit does not satisfy the sharing policy's constraints"
                non-owner-root-targeting:
                  summary: initiatingOuId used root-targeting mode but is not the role's own owning organization unit
                  value:
                    code: "SHR-1004"
                    message:
                      key: "error.sharingservice.invalid_target_ou"
                      defaultValue: "Invalid target organization unit"
                    description:
                      key: "error.sharingservice.invalid_target_ou_description"
                      defaultValue: "The target organization unit does not satisfy the sharing policy's constraints"
                not-shared:
                  summary: |
                    initiatingOuId used children-targeting mode but is not the role's owner and has no grant
                    making it visible
                  value:
                    code: "SHR-1005"
                    message:
                      key: "error.sharingservice.not_shared"
                      defaultValue: "Resource not shared to this organization unit"
                    description:
                      key: "error.sharingservice.not_shared_description"
                      defaultValue: "The resource has not been shared or reshared to the given organization unit"
                field-not-templated:
                  summary: An editableFields entry is not "assignments" or one of the assignments.* fields
                  value:
                    code: "SHR-1006"
                    message:
                      key: "error.sharingservice.field_not_templated"
                      defaultValue: "Field is not a templated field"
                    description:
                      key: "error.sharingservice.field_not_templated_description"
                      defaultValue: "The given field is not declared as a templated field for this resource type"
                editability-cannot-be-expanded:
                  summary: |
                    A reshare's editableFields names a field initiatingOuId cannot itself currently edit
                  value:
                    code: "SHR-1008"
                    message:
                      key: "error.sharingservice.editability_cannot_be_expanded"
                      defaultValue: "Editability cannot be expanded on reshare"
                    description:
                      key: "error.sharingservice.editability_cannot_be_expanded_description"
                      defaultValue: "A reshare may only narrow which templated fields are editable relative to what the acting organization unit itself currently holds, never widen it"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1003"
                message:
                  key: "error.roleservice.role_not_found"
                  defaultValue: "Role not found"
                description:
                  key: "error.roleservice.role_not_found_description"
                  defaultValue: "The role with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"
    get:
      tags:
        - Role sharing
      summary: List grants for a role
      description: |
        Returns the role's grants, one page at a time.

        Each grant's `stage` says who issued it, not which target mode was used: `share` for the
        role's own owning organization unit, `reshare` for a sharee passing it further down its own
        subtree.

        Grants declared in a role's declarative YAML (`grants:`) are held in memory rather than
        stored, and merged with the stored ones here, so both appear in this list. A declared grant
        cannot be revoked through the API: it belongs to the file that declares it.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
      responses:
        "200":
          description: Paginated list of grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantListResponse'
              example:
                totalResults: 5
                startIndex: 1
                count: 2
                grants:
                  - id: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
                    stage: "share"
                    targetScope: "root"
                    targetOuId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                    owningOuId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                    editableFields:
                      - "assignments"
                  - id: "2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e"
                    stage: "reshare"
                    targetScope: "all_children"
                    targetOuId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                    owningOuId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                    excludedOuIds:
                      - "9c2e1a5c-2b1e-4f0a-8c1a-5a6b7c8d9e0f"
                    editableFields:
                      - "assignments.group"
                links:
                  - href: "roles/3fa85f64-5717-4562-b3fc-2c963f66afa6/grants?offset=2&limit=2"
                    rel: "next"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1008"
                message: "Invalid request"
                description: "Invalid limit parameter"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

  /roles/{id}/grants/{grantId}:
    delete:
      tags:
        - Role sharing
      summary: Revoke a grant
      description: |
        Revokes the grant, along with any reshare grants derived from it. Every organization unit
        that loses access has its assignments for the role deleted, so no stale permissions remain.

        Revoking an `allRoots` grant stops it governing future reshares and assignments; it does
        not go back and purge assignments Root organization units already made.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: grantId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Grant revoked
        "400":
          description: |
            Bad request. The grant is declared in a role's declarative YAML, so it belongs to that
            file and can only be changed there. Nothing is revoked, and no `OnUnshare` hook fires.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SHR-1010"
                message:
                  key: "error.sharingservice.grant_declarative"
                  defaultValue: "Grant cannot be modified"
                description:
                  key: "error.sharingservice.grant_declarative_description"
                  defaultValue: "The grant is defined in a declarative resource file and can only be changed there"
        "404":
          description: Grant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SHR-1003"
                message:
                  key: "error.sharingservice.grant_not_found"
                  defaultValue: "Grant not found"
                description:
                  key: "error.sharingservice.grant_not_found_description"
                  defaultValue: "The grant with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

  /roles/{id}/editable-fields:
    get:
      tags:
        - Role sharing
      summary: Get templated fields editable by an organization unit
      description: |
        Returns the templated fields (`assignments` and/or the `assignments.*` types) currently
        editable by `ouId` for this role: every declared field when `ouId` is the role's own owning
        organization unit, or whichever fields the grant that makes the role visible to `ouId`
        allows, for a sharee. A grant fixes this set when it is created; see
        `ShareRequest.editableFields`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: ouId
          required: false
          description: |
            The organization unit to resolve editability for. Optional; defaults to the role's own
            owning organization unit when omitted.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Editable fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableFieldsResponse'
              example:
                fields:
                  - "assignments.group"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1023"
                message:
                  key: "error.roleservice.role_outside_own_ou_scope"
                  defaultValue: "Outside the caller's organization unit scope"
                description:
                  key: "error.roleservice.role_outside_own_ou_scope_description"
                  defaultValue: "The system:roles scope confines the caller to its own token-issued organization unit; the requested organization unit is outside that scope"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1003"
                message:
                  key: "error.roleservice.role_not_found"
                  defaultValue: "Role not found"
                description:
                  key: "error.roleservice.role_not_found_description"
                  defaultValue: "The role with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:8090/oauth2/authorize
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs
            system:roles: |
              Full access to the Role Management API, confined to the token's own organization
              unit.
            system:roles:view: |
              Read-only access to the Role Management API, confined to the token's own
              organization unit.
        clientCredentials:
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs
            system:roles: |
              Full access to the Role Management API, confined to the token's own organization
              unit.
            system:roles:view: |
              Read-only access to the Role Management API, confined to the token's own
              organization unit.

  parameters:
    limitQueryParam:
      in: query
      name: limit
      required: false
      description: |
        Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        default: 30
    offsetQueryParam:
      in: query
      name: offset
      required: false
      description: |
        Number of records to skip for pagination.
      schema:
        type: integer
        minimum: 0
        default: 0
    assigneeTypeQueryParam:
      in: query
      name: type
      required: false
      schema:
        type: string
        enum:
          - user
          - group
          - app
          - agent
      description: |
        Filter assignments by assignee type. When omitted, assignments of all types are returned.
    includeQueryParam:
      in: query
      name: include
      required: false
      schema:
        type: string
        enum:
          - display
      description: |
        Optional parameter to include additional information.
        - `display` - Include display names for users and groups. For users, the display value is resolved from the schema-configured display attribute (`systemAttributes.display`). Falls back to the user ID if no display attribute is configured, the configured attribute path does not exist in the user's data, or the attribute value is empty. For groups, the group name is used.
    ouIdListingQueryParam:
      in: query
      name: ouId
      required: false
      schema:
        type: string
        format: uuid
      description: |
        Organization unit to list roles for. When present, the response includes both roles
        owned by this organization unit and roles shared to it, each tagged with `origin`. When
        absent, the deployment-wide listing is returned (no `origin` tag).
    ouIdActingQueryParam:
      in: query
      name: ouId
      required: false
      schema:
        type: string
        format: uuid
      description: |
        The organization unit to act as when reading or writing the role's `assignments`. Empty
        (the default) means the role's owning organization unit. This preserves prior behavior
        for every caller that doesn't participate in sharing. A non-empty value identifies a
        sharee organization unit acting on its own assignments: for writes (add/remove), the role
        must currently be shared to it, and, for every distinct assignee type present in the
        request, the matching `assignments.*` field must be editable for it; otherwise the whole
        request is rejected. For reads, an organization
        unit with no assignments of its own simply sees an empty list.
  schemas:
    Assignment:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          format: uuid
          description: "ID of the user, app, agent, or group being assigned"
        type:
          type: string
          enum:
            - user
            - group
            - app
            - agent
          description: "Type of entity being assigned (user, app, agent, or group)"
        display:
          type: string
          readOnly: true
          description: "Display name of the user or group (only included when include=display query parameter is used). For users, resolved from the schema-configured display attribute; falls back to the user ID if the attribute is not configured, the path does not exist, or the value is empty. For groups, the group name is used."

    AssignmentInput:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          format: uuid
          description: "ID of the user, app, agent, or group being assigned"
        type:
          type: string
          enum:
            - user
            - group
            - app
            - agent
          description: "Type of entity being assigned (user, app, agent, or group)"

    ResourcePermissions:
      type: object
      required: [resourceServerId, permissions]
      properties:
        resourceServerId:
          type: string
          format: uuid
          description: "ID of the resource server these permissions belong to"
        permissions:
          type: array
          items:
            type: string
          description: "List of permission strings for this resource server"

    RoleSummary:
      type: object
      required: [id, name, ouId]
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the role"
        name:
          type: string
          description: "Name of the role"
        description:
          type: string
          nullable: true
          description: "Optional description of the role"
        ouId:
          type: string
          format: uuid
          description: "ID of the organization unit this role belongs to"
        ouHandle:
          type: string
          readOnly: true
          description: "Handle of the organization unit this role belongs to"
        isReadOnly:
          type: boolean
          readOnly: true
          description: "Indicates if the role is defined in declarative configuration and cannot be modified"
        origin:
          type: string
          readOnly: true
          enum:
            - owned
            - shared
          description: "Present only when listing roles with the ouId query parameter: whether the organization unit owns this role or the role was shared to it."

    Role:
      type: object
      required: [id, name, ouId, permissions]
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the role"
        name:
          type: string
          description: "Name of the role"
        description:
          type: string
          nullable: true
          description: "Optional description of the role"
        ouId:
          type: string
          format: uuid
          description: "ID of the organization unit this role belongs to"
        ouHandle:
          type: string
          readOnly: true
          description: "Handle of the organization unit this role belongs to"
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ResourcePermissions'
          description: "List of resource permissions grouped by resource server. Always returned as an array, with an empty array when the role has no permissions."

    RoleWithAssignments:
      allOf:
        - $ref: '#/components/schemas/Role'
        - type: object
          properties:
            assignments:
              type: array
              items:
                $ref: '#/components/schemas/Assignment'
              description: "List of user and group assignments with display names"

    CreateRoleRequest:
      type: object
      required: [name, ouId]
      properties:
        name:
          type: string
          description: "Name of the role"
        description:
          type: string
          description: "Optional description of the role"
        ouId:
          type: string
          format: uuid
          description: "ID of the organization unit this role belongs to"
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ResourcePermissions'
          description: "Optional list of initial permissions grouped by resource server"
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentInput'
          description: "Optional list of initial user and group assignments"

    UpdateRoleRequest:
      type: object
      required: [name, ouId, permissions]
      properties:
        name:
          type: string
          description: "Name of the role"
        description:
          type: string
          description: "Optional description of the role"
        ouId:
          type: string
          format: uuid
          description: "ID of the organization unit this role belongs to"
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ResourcePermissions'
          description: "List of resource permissions grouped by resource server"

    AssignmentsRequest:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentInput'
          description: "List of user and group assignments"

    RoleListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: "Number of results that match the listing operation."
          example: 8
        startIndex:
          type: integer
          description: "Index of the first element of the page, which will be equal to offset + 1."
          example: 1
        count:
          type: integer
          description: "Number of elements in the returned page."
          example: 5
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleSummary'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    AssignmentListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: "Number of results that match the listing operation."
          example: 20
        startIndex:
          type: integer
          description: "Index of the first element of the page, which will be equal to offset + 1."
          example: 1
        count:
          type: integer
          description: "Number of elements in the returned page."
          example: 10
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    Link:
      type: object
      properties:
        href:
          type: string
          example: "roles?offset=20&limit=10"
        rel:
          type: string
          example: "next"

    ShareTarget:
      type: object
      required: [ouId]
      description: |
        One organization unit to share to, and whether its own subtree comes with it. The named
        organization unit must be a direct child of `initiatingOuId` either way; `allChildren` only
        decides how far below that child the grant reaches, which is never more than the child
        could have granted for itself.
      properties:
        ouId:
          type: string
          format: uuid
          description: The organization unit being shared to. Must be initiatingOuId's direct child.
        allChildren:
          type: boolean
          description: |
            Additionally share to every organization unit in this one's own subtree, at any depth,
            including ones created later. Omit to share to the named organization unit alone,
            leaving it to decide whether the role travels any further down. Produces the
            `ou_subtree` target scope rather than `ou`.

    ShareRequest:
      type: object
      description: |
        Exactly one of two target-scope modes must be selected: root-targeting (`allRoots` or
        `rootOuIds`) or children-targeting (`allChildren` or `ouIds`).
      properties:
        initiatingOuId:
          type: string
          format: uuid
          description: |
            The organization unit performing this share. Defaults to the role's own owning
            organization unit. Root-targeting requires it to be that owning organization unit;
            children-targeting accepts any organization unit the role is currently visible to,
            including the owner itself. Named distinctly from the `ouIds` targets below, which are
            the organization units being shared *to*.
        allRoots:
          type: boolean
          description: Share to every current and future Root organization unit. Root-targeting mode.
        rootOuIds:
          type: array
          items:
            type: string
            format: uuid
          description: Share to these specific Root organization units. Root-targeting mode.
        excludedRootOuIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Carves these Root organization units, and their entire subtrees, out of an `allRoots`
            share (e.g. "share to all Roots except this one"). Each must itself be a Root
            organization unit. Ignored unless `allRoots` is true.
        allChildren:
          type: boolean
          description: |
            Share to every organization unit in initiatingOuId's subtree, including ones created
            afterward, any depth, in one grant. Children-targeting mode.
        ouIds:
          type: array
          items:
            $ref: '#/components/schemas/ShareTarget'
          description: |
            Share to these specific organization units, each of which must be initiatingOuId's
            direct child; reaching a grandchild selectively requires that child to issue its own
            children-targeting call in turn. Each entry decides for itself whether that child's own
            subtree comes with it. Ignored when `allChildren` is true. Children-targeting mode.
        excludedOuIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Carves these organization units, and their entire subtrees, out of an `allChildren`
            share (e.g. "share to all children except these"), or out of any `ouIds` entry whose
            own subtree contains them. Each must be initiatingOuId itself or within its subtree.
            Ignored when neither applies. An exclusion outside a given entry's subtree is inert
            for that entry rather than an error, so one list can accompany several entries.
        editableFields:
          type: array
          items:
            type: string
            enum:
              - "assignments"
              - "assignments.user"
              - "assignments.group"
              - "assignments.app"
              - "assignments.agent"
          description: |
            Templated fields made editable through this grant, fixed at creation: to change them,
            revoke the grant and share again. Omit for "everything": every field when `initiatingOuId`
            is the role's own owning organization unit, or exactly `initiatingOuId`'s own current
            editable set when `initiatingOuId` is a sharee resharing. A reshare may only narrow this
            set, never widen it (`SHR-1008` if it tries to).

    Grant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stage:
          type: string
          enum:
            - share
            - reshare
          description: |
            Who issued this grant, not which target-scope mode it used: `share` for a grant issued
            by the role's own owning organization unit (whether root-targeting or children-targeting
            mode), `reshare` for a grant issued by a previously-visible sharee organization unit
            distributing further within its own subtree.
        targetScope:
          type: string
          enum:
            - all_roots
            - root
            - all_children
            - ou
            - ou_subtree
          description: |
            The breadth of organization units this grant targets. `ou` is one named organization
            unit alone; `ou_subtree` is one named organization unit together with its whole
            subtree, at any depth (from an `ouIds` entry with `allChildren` set); `all_children` is
            every organization unit beneath the one that issued the grant.
        targetOuId:
          type: string
          format: uuid
        owningOuId:
          type: string
          format: uuid
          description: The organization unit that owns the shared role.
        excludedOuIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Organization units (and their subtrees) carved out of this grant. Only ever non-empty
            for the target scopes that carry a subtree with them: `all_roots`, `all_children` and
            `ou_subtree`. A plain `ou` grant reaches one organization unit and no further, so there
            is nothing under it to carve out.
        editableFields:
          type: array
          items:
            type: string
          description: The templated fields made editable through this grant (see ShareRequest.editableFields).

    GrantCreationResponse:
      type: object
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
          description: |
            Every grant the request created. A single root-targeting share can fan out to more than
            one grant, so this is a creation result rather than a page of an existing list.

    GrantListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: Total number of grants recorded for the role.
        startIndex:
          type: integer
          description: 1-based index of the first grant in this page.
        count:
          type: integer
          description: Number of grants in this page.
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    EditableFieldsResponse:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items:
            type: string
          description: The templated fields currently editable by the requested organization unit.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: "Error code. The prefix identifies the service that produced the error, for example ROL for role management or SAZ for system authorization."
          example: "ROL-1001"
        message:
          $ref: '#/components/schemas/I18nMessage'
        description:
          $ref: '#/components/schemas/I18nMessage'

    I18nMessage:
      type: object
      description: Internationalized message with translation key and default value.
      required:
        - key
        - defaultValue
      properties:
        key:
          type: string
          description: Translation key for fetching localized message.
        defaultValue:
          type: string
          description: Default message in English (fallback).
