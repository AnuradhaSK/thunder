# Backend service granted to one selected child organization unit only
resource_type: application
id: decl-m2m-selective
name: M2M Service (Selective)
description: Backend service granted to one selected child organization unit only
ouId: decl-m2m-root
type: fullstack
template: web
url: https://example.com
grants:
  - ouIds:
      - decl-m2m-child-a
inboundAuthConfig:
  - type: "oauth2"
    config:
      clientId: "decl-m2m-selective-client"
      clientSecret: "decl-m2m-selective-secret"
      grantTypes:
        - "client_credentials"
      tokenEndpointAuthMethod: "client_secret_basic"
      pkceRequired: false
      publicClient: false
      token:
        accessToken:
          clientConfig:
            # Opt in to the organization unit claims so the token states which organization it was
            # issued for. On an /ou/{ouId} request these resolve to the accessing OU, not the owner.
            attributes:
              - ouId
              - ouName
              - ouHandle
