# Backend service granted to the whole subtree beneath its owning organization unit
resource_type: application
id: decl-m2m-subtree
name: M2M Service (Owning Subtree)
description: Backend service granted to the whole subtree beneath its owning organization unit
ouId: decl-m2m-root
type: fullstack
template: web
url: https://example.com
grants:
  - allChildren: true
inboundAuthConfig:
  - type: "oauth2"
    config:
      clientId: "decl-m2m-subtree-client"
      clientSecret: "decl-m2m-subtree-secret"
      grantTypes:
        - "client_credentials"
      tokenEndpointAuthMethod: "client_secret_basic"
      pkceRequired: false
      publicClient: false
      token:
        accessToken:
          clientConfig:
            # Opt in to the organization unit claims so the token states which organization it was
            # issued for. On an /ou/{ouId} request these resolve to the accessing OU, not the owner.
            attributes:
              - ouId
              - ouName
              - ouHandle
