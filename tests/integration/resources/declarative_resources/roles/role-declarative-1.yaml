resource_type: role
id: decl-role-1
name: Declarative Test Role
description: A declarative test role for integration testing
# Addressed by handle rather than id, so the loader's ou_handle resolution is exercised.
ouHandle: decl-ou-1
permissions:
  - resourceServerId: decl-rs-1
    permissions:
      - test-resource:read
# The tests assign this role to principals in organization units they create at runtime, each the
# root of its own tree, so the role is shared with the root of every other tree.
sharingPolicies:
  - id: decl-role-1-policy-owner
    otherTreeRoots:
      mode: all
assignments:
  - id: decl-user-1
    type: user
  - id: decl-group-1
    type: group
