resource_type: role
id: decl-shared-role
name: Declarative Shared Role
description: A declarative role assignable in the organization units it is shared with
ouId: decl-m2m-root
permissions:
  - resourceServerId: decl-rs-1
    permissions:
      - test-resource:read
# Children named one by one, each on its own terms. Child A may assign the role to anyone it has.
# Child B may not assign it to groups. Child C is not named, so the role cannot be assigned there.
sharingPolicies:
  - id: decl-shared-role-policy-owner
    childUnits:
      mode: selected
      units:
        - ouId: decl-m2m-child-a
          reach: unit
        - ouId: decl-m2m-child-b
          reach: unit
          overlayRules:
            assignments.groups:
              editable: false
assignments:
  # An assignment names the organization unit it is made in. This application is owned by the root
  # and shared with child A, where it holds the role.
  - id: decl-m2m-selected
    type: app
    ouId: decl-m2m-child-a
